{% extends "base.html" %}

{% block content %}

<h2>Create Study</h2>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Study Name</label>
        <input type="text" name="name" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Protocol ID</label>
        <input type="text" name="protocol_id" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control"></textarea>
    </div>

    <button class="btn btn-primary" type="submit">
        Create Study
    </button>
</form>

{% endblock %}
