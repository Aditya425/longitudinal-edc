{% extends "base.html" %}
{% block title %}Edit Participant{% endblock %}
{% block content %}
<a href="{% url 'participants_list' study.id %}" class="btn btn-secondary mb-3">&larr; Back</a>

{% if error %}
<div class="alert alert-danger">Participant code already exists for this study!</div>
{% endif %}

<h2>Edit Participant</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>Participant Code</label>
        <input type="text" name="participant_code" value="{{ participant.participant_code }}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Birth Year</label>
        <input type="number" name="birth_year" value="{{ participant.birth_year|default:'' }}" class="form-control">
    </div>
    <div class="mb-3">
        <label>Sex</label>
        <select name="sex" class="form-control">
            <option value="M" {% if participant.sex == 'M' %}selected{% endif %}>Male</option>
            <option value="F" {% if participant.sex == 'F' %}selected{% endif %}>Female</option>
            <option value="O" {% if participant.sex == 'O' %}selected{% endif %}>Other</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Enrolled At</label>
        <input type="date" name="enrolled_at" value="{{ participant.enrolled_at|date:'Y-m-d' }}" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'participants_list' study.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
